<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,900;1,600;1,700;1,900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg:'#080502', orange:'#FF6600', card:'#120b05', border:'#2a1a08' },
          fontFamily: { mono:['DM Mono','monospace'], condensed:['Barlow Condensed','sans-serif'] }

  <style>
    *{box-sizing:border-box}
    body{background:#080502;color:white;font-family:'DM Mono',monospace;overflow-x:hidden}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:#080502}
    ::-webkit-scrollbar-thumb{background:#FF6600;border-radius:2px}

    @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    .ticker-inner{animation:ticker 28s linear infinite;white-space:nowrap;display:inline-flex}
    .ticker-inner:hover{animation-play-state:paused}

    @keyframes toastIn{from{opacity:0;transform:translateY(-12px) translateX(-50%)}to{opacity:1;transform:translateY(0) translateX(-50%)}}
    .toast{animation:toastIn .3s ease both}

    .img-zoom{transition:transform 0.6s ease,filter 0.6s ease;filter:grayscale(20%)}
    .img-zoom:hover{transform:scale(1.06);filter:grayscale(0%)}

    .btn-primary{background:#FF6600;color:#080502;font-weight:900;font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;font-style:italic;transition:all .2s;border:2px solid #FF6600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn-primary:hover{background:white;color:#080502;border-color:white;transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,102,0,.3)}

    .btn-secondary{background:transparent;color:#FF6600;font-weight:900;font-family:'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;font-style:italic;transition:all .2s;border:2px solid #FF6600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
    .btn-secondary:hover{background:#FF6600;color:#080502;transform:translateY(-2px)}

    .cart-sidebar{transform:translateX(100%);transition:transform .4s cubic-bezier(.16,1,.3,1)}
    .cart-sidebar.open{transform:translateX(0)}
    .overlay{opacity:0;pointer-events:none;transition:opacity .3s ease}
    .overlay.show{opacity:1;pointer-events:all}

    .section-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-style:italic;text-transform:uppercase}
    .encargo-badge{background:#FF6600;color:#080502;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:.08em;font-size:10px;padding:2px 8px}

    input,textarea{background:#120b05;border:1px solid #2a1a08;color:white;font-family:'DM Mono',monospace;outline:none;transition:border-color .2s}
    input:focus,textarea:focus{border-color:#FF6600}

    @keyframes glitch{0%,89%,100%{text-shadow:none}90%{text-shadow:3px 0 #FF6600,-3px 0 #00ffff}92%{text-shadow:-3px 0 #FF6600,3px 0 #00ffff}94%{text-shadow:none}}
    .logo-glitch{animation:glitch 6s infinite}

    @keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .8s ease both}
    .fade-up-2{animation:fadeUp .8s .15s ease both}
    .fade-up-3{animation:fadeUp .8s .3s ease both}

    .hero-line{overflow:hidden}
    .lifestyle-grid img{transition:transform .6s ease,filter .6s ease;filter:grayscale(30%)}
    .lifestyle-grid img:hover{transform:scale(1.04);filter:grayscale(0%)}

    .noise{position:relative}
    .noise::before{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:1;opacity:.5}
  </style>
</head>

/* ── TOAST ── */
function Toast({ message, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
  return (
    <div className="toast fixed top-5 left-1/2 z-[200] bg-orange text-bg px-6 py-3 text-sm font-bold font-condensed uppercase tracking-widest shadow-2xl"
         style={{transform:'translateX(-50%)'}}>
      + {message} agregado al pedido
    </div>
  );
}

/* ── NAVBAR ── */
function Navbar({ cartCount, onCartOpen }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {

    <nav className={`sticky top-0 z-50 border-b border-border transition-all duration-300 ${scrolled ? 'bg-bg/95 backdrop-blur-md' : 'bg-transparent'}`}>

  return (
    <div className="bg-orange overflow-hidden py-2 select-none">
      <div className="ticker-inner">
        <span className="font-condensed font-black italic text-bg text-sm tracking-widest uppercase px-6">
          {text + text + text}
        </span>
      </div>
    </div>
  );
}

/* ── LIFESTYLE GRID ── */

/* ── MODEL CARD ── */
function ModelCard({ model, onClick }) {

/* ── MODEL MODAL ── */
function ModelModal({ model, onClose, onAdd }) {
  const [activeVariant, setActiveVariant] = useState(model.variants[0]);
  const [selectedSize,  setSelectedSize]  = useState(null);
  const [sizeError,     setSizeError]     = useState(false);
  const [added,         setAdded]         = useState(false);

  // Close on ESC
  useEffect(() => {
    const fn = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, [onClose]);

  const handleVariantChange = (v) => {
    setActiveVariant(v);
    setSelectedSize(null);
    setSizeError(false);
    setAdded(false);
  };

  const handleAdd = () => {
    if (!selectedSize) { setSizeError(true); setTimeout(() => setSizeError(false), 1800); return; }
    onAdd({ ...activeVariant, brand: model.brand, model: model.model }, selectedSize);
    setAdded(true);
    setTimeout(() => { setAdded(false); setSelectedSize(null); }, 1600);
  };

  return (
    <div className="fixed inset-0 z-[150] flex items-center justify-center p-4" style={{backdropFilter:'blur(6px)'}}>
      {/* Backdrop */}
      <div className="absolute inset-0 bg-bg/90" onClick={onClose}/>

      {/* Modal box */}
      <div className="relative bg-card border border-border w-full max-w-4xl max-h-[92vh] overflow-hidden flex flex-col md:flex-row">

        {/* Close */}
        <button onClick={onClose} className="absolute top-4 right-4 z-10 text-gray-500 hover:text-orange transition-colors p-1">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>

        {/* LEFT — product image */}
        <div className="relative flex-shrink-0 bg-card overflow-hidden flex items-center justify-center" style={{width:'100%', maxWidth:'420px', minHeight:'320px', flex:'1'}}>
          <img
            key={activeVariant.id}
            src={activeVariant.img}
            alt={`${model.model} ${activeVariant.color}`}
            className="w-full h-full"
            style={{objectFit:'contain', objectPosition:'center', minHeight:'320px', maxHeight:'560px', transition:'opacity .3s', padding:'16px'}}
            onError={e => { e.target.src=`https://via.placeholder.com/420x560/120b05/FF6600?text=${model.model}`; }}
          />
          <div className="absolute top-4 left-4 bg-bg/80 backdrop-blur-sm px-3 py-1">
            <span className="font-mono text-[10px] text-orange uppercase tracking-[.3em]">{model.brand}</span>
          </div>
        </div>

        {/* RIGHT — info + selector */}
        <div className="flex flex-col p-6 md:p-8 overflow-y-auto" style={{flex:'1', minWidth:0}}>
          {/* Header */}

/* ── CHECKOUT MODAL ── */
function CheckoutModal({ cart, onClose }) {
  const total = cart.reduce((acc, i) => acc + i.price * i.qty, 0);
  const [step,    setStep]    = useState(1); // 1=form, 2=loading, 3=success, 4=error
  const [form,    setForm]    = useState({ name:'', email:'', phone:'', province:'', address:'' });
  const [waLink,  setWaLink]  = useState('');
  const [errMsg,  setErrMsg]  = useState('');

  const fields = [
    { key:'name',     label:'Nombre completo',    type:'text' },
    { key:'email',    label:'Email',               type:'email' },
    { key:'phone',    label:'WhatsApp / Teléfono', type:'tel' },
    { key:'province', label:'Provincia',           type:'text' },
    { key:'address',  label:'Dirección de envío',  type:'text' },
  ];

  const handleSubmit = async (e) => {
    e.preventDefault();
    setStep(2); // loading

    // Armar los items para el backend
    const items = cart.flatMap(item =>
      Array.from({ length: item.qty }, () => ({
        brand: item.brand,
        model: item.model,
        color: item.color,
        size:  item.size,
        price: item.price,
      }))
    );

    const cliente = {
      nombre:    form.name,
      email:     form.email,
      telefono:  form.phone,
      provincia: form.province,
      direccion: form.address,
    };

    try {
      const res  = await fetch('http://localhost:3001/api/pedido', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ items, cliente }),
      });
      const data = await res.json();

      if (data.ok) {
        setWaLink(data.whatsappUrl);
        setStep(3); // success
        // Abrir WhatsApp automáticamente
        window.open(data.whatsappUrl, '_blank');
      } else {
        setErrMsg(data.error || 'Error al procesar el pedido.');
        setStep(4); // error
      }
    } catch (err) {
      setErrMsg('No se pudo conectar con el servidor. Asegurate de que el backend esté corriendo.');
      setStep(4); // error
    }
  };

  return (
    <div className="fixed inset-0 z-[150] flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-bg/90 backdrop-blur-md" onClick={step !== 2 ? onClose : undefined}/>
      <div className="relative bg-card border border-border w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between p-6 border-b border-border">
          <h3 className="font-condensed font-black italic text-2xl uppercase">
            {step === 1 && 'Datos del Encargo'}
            {step === 2 && 'Procesando...'}
            {step === 3 && '¡Pedido Confirmado!'}
            {step === 4 && 'Algo salió mal'}
          </h3>
          {step !== 2 && (
            <button onClick={onClose} className="text-gray-500 hover:text-orange transition-colors">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          )}
        </div>

        {/* PASO 1 — Formulario */}
        {step === 1 && (
          <form onSubmit={handleSubmit} className="p-6 space-y-4">
            {fields.map(f => (
              <input key={f.key} type={f.type} placeholder={f.label} required
                value={form[f.key]} onChange={e => setForm({...form,[f.key]:e.target.value})}
                className="px-4 py-3 text-sm w-full"/>
            ))}
            <div className="border border-border p-4 bg-bg">
              <p className="font-mono text-[10px] text-orange uppercase tracking-widest mb-3">Detalle del pedido</p>
              {cart.map(item => (
                <div key={`${item.id}-${item.size}`} className="flex justify-between font-mono text-xs text-gray-400 py-1 border-b border-border last:border-0">
                  <span>{item.brand} {item.model} T.{item.size} x{item.qty}</span>
                  <span>${item.price * item.qty} USD</span>
                </div>
              ))}
              <div className="flex justify-between mt-3 font-condensed font-black italic text-2xl">
                <span>TOTAL REF.</span><span>${total} USD</span>
              </div>
              <p className="font-mono text-[10px] text-gray-600 mt-2">Precio final en ARS a confirmar por WhatsApp.</p>
            </div>
            <button type="submit" className="btn-primary w-full py-4 text-xl">Confirmar Encargo</button>
          </form>
        )}

        {/* PASO 2 — Loading */}
        {step === 2 && (
          <div className="p-16 text-center">
            <div className="inline-block w-10 h-10 border-4 border-border border-t-orange rounded-full mb-6"
                 style={{animation:'spin 1s linear infinite'}}/>
            <p className="font-condensed font-black italic text-xl uppercase text-gray-400">Enviando pedido...</p>
            <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
          </div>
        )}

        {/* PASO 3 — Éxito */}
        {step === 3 && (
          <div className="p-10 text-center">
            <p className="font-condensed font-black italic text-6xl text-orange mb-4">🔥</p>
            <h4 className="section-title text-3xl mb-4">ENCARGO RECIBIDO</h4>
            <p className="font-mono text-gray-400 text-sm leading-loose mb-4">
              ¡Gracias, {form.name}! Te mandamos un email de confirmación y se abrió WhatsApp para coordinar el pago.
            </p>
            <p className="font-mono text-xs text-gray-600 mb-6">
              Ref: <span className="text-orange font-bold">${total} USD</span> · <span className="text-white">{form.email}</span>
            </p>
            <a href={waLink} target="_blank" rel="noopener noreferrer" className="btn-primary px-8 py-3 text-lg mb-3 w-full">
              Abrir WhatsApp
            </a>
            <button onClick={onClose} className="btn-secondary w-full py-3 text-sm mt-2">Volver al Catálogo</button>
          </div>
        )}

        {/* PASO 4 — Error */}
        {step === 4 && (
          <div className="p-10 text-center">
            <p className="font-condensed font-black italic text-5xl text-red-500 mb-4">!</p>
            <h4 className="section-title text-2xl mb-4 text-red-400">ERROR</h4>
            <p className="font-mono text-gray-400 text-sm leading-loose mb-6">{errMsg}</p>
            <button onClick={() => setStep(1)} className="btn-primary px-8 py-3 text-lg w-full">Intentar de nuevo</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [cart,         setCart]         = useState([]);
  const [cartOpen,     setCartOpen]     = useState(false);
  const [toast,        setToast]        = useState(null);
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const cartCount = cart.reduce((acc, i) => acc + i.qty, 0);

  const handleAdd = useCallback((product, size) => {
    setCart(prev => {
      const exists = prev.find(i => i.id === product.id && i.size === size);
      if (exists) return prev.map(i => i.id === product.id && i.size === size ? {...i, qty:i.qty+1} : i);
      return [...prev, {...product, size, qty:1}];
    });
    setToast(`${product.brand} ${product.model} T.${size}`);
  }, []);

  const handleRemove = useCallback((item) => {
    setCart(prev => prev.filter(i => !(i.id === item.id && i.size === item.size)));
  }, []);

  const handleQtyChange = useCallback((item, newQty) => {
    if (newQty <= 0) { handleRemove(item); return; }
    setCart(prev => prev.map(i => i.id === item.id && i.size === item.size ? {...i, qty:newQty} : i));
  }, [handleRemove]);

  return (
    <>
      {toast && <Toast message={toast} onDone={() => setToast(null)}/>}
      <Navbar cartCount={cartCount} onCartOpen={() => setCartOpen(true)}/>
      <Ticker/>
      <Hero/>
      <LifestyleSection/>
      <Catalog onAdd={handleAdd}/>
      <ComoFunciona/>
      <Footer/>
      <CartSidebar
        cart={cart} isOpen={cartOpen}
        onClose={() => setCartOpen(false)}
        onRemove={handleRemove}
        onQtyChange={handleQtyChange}
        onCheckout={() => { setCartOpen(false); setCheckoutOpen(true); }}
      />
      {checkoutOpen && (
        <CheckoutModal
          cart={cart}
          onClose={() => { setCheckoutOpen(false); setCart([]); }}
        />
      )}
    </>
  );
}
