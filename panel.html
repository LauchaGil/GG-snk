<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG'SNK — Panel de Control</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,900;1,600;1,700;1,900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { bg: '#080502', orange: '#FF6600', card: '#120b05', border: '#2a1a08' },
          fontFamily: { mono: ['DM Mono', 'monospace'], condensed: ['Barlow Condensed', 'sans-serif'] }
        }
      }
    }

  </script>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      background: #080502;
      color: white;
      font-family: 'DM Mono', monospace;
    }

    ::-webkit-scrollbar {
      width: 4px
    }

    ::-webkit-scrollbar-track {
      background: #080502
    }

    ::-webkit-scrollbar-thumb {
      background: #FF6600;
      border-radius: 2px
    }

    .btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: .06em;
      cursor: pointer;
      transition: all .2s;
      border: 2px solid;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: #FF6600;
      color: #080502;
      border-color: #FF6600;
    }

    .btn-primary:hover {
      background: white;
      border-color: white;
    }

    .btn-secondary {
      background: transparent;
      color: #FF6600;
      border-color: #FF6600;
    }

    .btn-secondary:hover {
      background: #FF6600;
      color: #080502;
    }

    input,
    select,
    textarea {
      background: #120b05;
      border: 1px solid #2a1a08;
      color: white;
      font-family: 'DM Mono', monospace;
      outline: none;
      transition: border-color .2s;
      font-size: 13px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #FF6600
    }

    select option {
      background: #120b05
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .fade-in {
      animation: fadeIn .3s ease both
    }
  </style>
</head>

<body>

  <!-- ── LOGIN ── -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm border border-border bg-card p-8">
      <p class="font-condensed font-black italic text-orange text-4xl mb-1">GG'SNK</p>
      <p class="font-mono text-gray-600 text-xs uppercase tracking-widest mb-8">Panel de Control</p>
      <form id="loginForm" class="space-y-4">
        <input id="passInput" type="password" placeholder="Contraseña" class="w-full px-4 py-3" />
        <p id="loginError" class="text-red-400 font-mono text-xs hidden">Contraseña incorrecta.</p>
        <button type="submit" class="btn btn-primary w-full py-3 text-lg">Entrar</button>
      </form>
    </div>
  </div>

  <!-- ── PANEL ── -->
  <div id="panelScreen" class="hidden min-h-screen">

    <!-- Navbar -->
    <nav
      class="sticky top-0 z-50 bg-bg/95 backdrop-blur-md border-b border-border px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span class="font-condensed font-black italic text-orange text-3xl">GG'SNK</span>
        <span class="font-mono text-gray-600 text-[10px] uppercase tracking-widest">Panel de Control</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="index.html" class="btn btn-secondary px-4 py-2 text-sm">← Ver Tienda</a>
        <button onclick="logout()"
          class="font-mono text-xs text-gray-500 hover:text-orange transition-colors uppercase tracking-widest">Salir</button>
      </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">

      <!-- Stats -->
      <div id="statsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3 mb-8"></div>

      <!-- Filtros -->
      <div class="flex flex-wrap items-center gap-3 mb-6">
        <p class="font-mono text-[10px] uppercase tracking-widest text-gray-600">Filtrar:</p>
        <div id="filtros" class="flex flex-wrap gap-2"></div>
        <div class="ml-auto flex items-center gap-3">
          <button onclick="abrirModalManual()" class="btn btn-primary px-4 py-2 text-sm whitespace-nowrap">+ Pedido manual</button>
          <input id="buscador" type="text" placeholder="Buscar por nombre o email..." class="px-4 py-2 w-64"
            oninput="renderTabla()" />
        </div>
      </div>

      <!-- Tabla -->
      <div class="border border-border overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead>
              <tr class="border-b border-border bg-card">
                <th class="text-left px-4 py-3 font-mono text-[10px] uppercase tracking-widest text-gray-600">#</th>
                <th class="text-left px-4 py-3 font-mono text-[10px] uppercase tracking-widest text-gray-600">Fecha</th>
                <th class="text-left px-4 py-3 font-mono text-[10px] uppercase tracking-widest text-gray-600">Cliente
                </th>
                <th class="text-left px-4 py-3 font-mono text-[10px] uppercase tracking-widest text-gray-600">Productos
                </th>
                <th class="text-left px-4 py-3 font-mono text-[10px] uppercase tracking-widest text-gray-600">Total</th>
                <th class="text-left px-4 py-3 font-mono text-[10px] uppercase tracking-widest text-gray-600">Estado
                </th>
                <th class="text-left px-4 py-3 font-mono text-[10px] uppercase tracking-widest text-gray-600">Acciones
                </th>
              </tr>
            </thead>
            <tbody id="tablaPedidos"></tbody>
          </table>
        </div>
        <div id="sinPedidos" class="hidden py-16 text-center">
          <p class="font-condensed font-black italic text-4xl text-gray-700 mb-2">SIN PEDIDOS</p>
          <p class="font-mono text-xs text-gray-600 uppercase tracking-widest">No hay pedidos para este filtro</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ── MODAL DETALLE ── -->
  <div id="modalDetalle" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-bg/90 backdrop-blur-md" onclick="cerrarModal()"></div>
    <div class="relative bg-card border border-border w-full max-w-2xl max-h-[90vh] overflow-y-auto fade-in">
      <div class="flex items-center justify-between p-6 border-b border-border">
        <h3 id="modalTitulo" class="font-condensed font-black italic text-2xl uppercase text-orange"></h3>
        <button onclick="cerrarModal()" class="text-gray-500 hover:text-orange transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="modalContenido" class="p-6 space-y-6"></div>
    </div>
  </div>

  <!-- MODAL PEDIDO MANUAL -->
  <div id="modalManual" class="hidden fixed inset-0 z-[200] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-bg/90 backdrop-blur-md" onclick="cerrarModalManual()"></div>
    <div class="relative bg-card border border-border w-full max-w-lg max-h-[90vh] overflow-y-auto fade-in">
      <div class="flex items-center justify-between p-6 border-b border-border">
        <h3 class="font-condensed font-black italic text-2xl uppercase text-orange">Nuevo pedido manual</h3>
        <button onclick="cerrarModalManual()" class="text-gray-500 hover:text-orange transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <form id="formManual" class="p-6 space-y-4">
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Producto *</label>
          <input id="mProducto" type="text" placeholder="Ej: Nike Air Max Plus 3 TN T.42" class="w-full px-3 py-2" required />
        </div>
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Cliente (opcional)</label>
          <input id="mNombre" type="text" placeholder="Nombre del comprador" class="w-full px-3 py-2" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Costo total (traerla) ARS</label>
            <input id="mCosto" type="number" min="0" step="any" placeholder="0" class="w-full px-3 py-2" oninput="calcGanancia()" />
          </div>
          <div>
            <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Precio de venta ARS *</label>
            <input id="mVenta" type="number" min="0" step="any" placeholder="0" class="w-full px-3 py-2" required oninput="calcGanancia()" />
          </div>
        </div>
        <div id="mGanancia" class="hidden border border-border bg-bg p-3 flex justify-between items-center font-condensed font-black italic text-xl">
          <span>GANANCIA</span><span id="mGananciaVal" class="text-green-400">$0 ARS</span>
        </div>
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Estado</label>
          <select id="mEstado" class="w-full px-3 py-2"></select>
        </div>
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Notas (opcional)</label>
          <textarea id="mNotas" rows="2" placeholder="Notas para vos..." class="w-full px-3 py-2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary w-full py-3 text-lg">Guardar pedido</button>
        <p id="mMsg" class="font-mono text-xs text-center hidden"></p>
      </form>
    </div>
  </div>

  <script>
    const API = 'https://ggsnk-backend.onrender.com';
    const PASS = 'LosTilos03';  // <-- Cambiá esto por tu contraseña

    const ESTADOS = ['Pendiente de pago', 'Pagado', 'Encargo realizado', 'En camino', 'Entregado'];
    const ESTADO_COLORS = {
      'Pendiente de pago': 'text-yellow-400 border-yellow-400/40 bg-yellow-400/10',
      'Pagado': 'text-green-400 border-green-400/40 bg-green-400/10',
      'Encargo realizado': 'text-blue-400 border-blue-400/40 bg-blue-400/10',
      'En camino': 'text-orange-400 border-orange-400/40 bg-orange-400/10',
      'Entregado': 'text-gray-400 border-gray-400/40 bg-gray-400/10',
    };

    let pedidos = [];
    let filtroActivo = 'TODOS';

    // ── LOGIN ──────────────────────────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const val = document.getElementById('passInput').value;
      if (val === PASS) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('panelScreen').classList.remove('hidden');
        cargarDatos();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    });

    function logout() {
      document.getElementById('panelScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('passInput').value = '';
    }

    // ── DATOS ──────────────────────────────────────────────────
    async function cargarDatos() {
      await Promise.all([cargarStats(), cargarPedidos()]);
    }

    async function cargarStats() {
      const res = await fetch(`${API}/api/stats`);
      const data = await res.json();
      const s = data.stats;
      document.getElementById('statsGrid').innerHTML = `
    ${statCard('TOTAL', s.total, 'Pedidos')}
    ${statCard('💳', s.pendiente, 'Pendiente pago', 'text-yellow-400')}
    ${statCard('✅', s.pagado, 'Pagados', 'text-green-400')}
    ${statCard('📦', s.encargado, 'Encargados', 'text-blue-400')}
    ${statCard('🚚', s.camino, 'En camino', 'text-orange-400')}
    ${statCard('🏠', s.entregado, 'Entregados', 'text-gray-400')}
    ${statCard('💵', '$' + Number(s.ingresos).toLocaleString('es-AR'), 'ARS cobrados', 'text-orange')}
  `;
    }

    function statCard(icon, value, label, colorClass = 'text-orange') {
      return `
    <div class="border border-border bg-card p-4 text-center">
      <p class="font-mono text-lg mb-1">${icon}</p>
      <p class="font-condensed font-black italic text-3xl ${colorClass}">${value}</p>
      <p class="font-mono text-[9px] uppercase tracking-widest text-gray-600 mt-1">${label}</p>
    </div>`;
    }

    async function cargarPedidos() {
      const res = await fetch(`${API}/api/pedidos`);
      const data = await res.json();
      pedidos = data.pedidos;
      renderFiltros();
      renderTabla();
    }

    // ── FILTROS ────────────────────────────────────────────────
    function renderFiltros() {
      const filtros = ['TODOS', ...ESTADOS];
      document.getElementById('filtros').innerHTML = filtros.map(f => `
    <button onclick="setFiltro('${f}')"
      class="font-mono text-xs uppercase tracking-widest px-3 py-1 border transition-all
             ${filtroActivo === f ? 'bg-orange text-bg border-orange font-bold' : 'border-border text-gray-500 hover:border-orange/50 hover:text-white'}">
      ${f}
    </button>`).join('');
    }

    function setFiltro(f) {
      filtroActivo = f;
      renderFiltros();
      renderTabla();
    }

    // ── TABLA ──────────────────────────────────────────────────
    function renderTabla() {
      const busqueda = document.getElementById('buscador').value.toLowerCase();
      let lista = pedidos;
      if (filtroActivo !== 'TODOS') lista = lista.filter(p => p.estado === filtroActivo);
      if (busqueda) lista = lista.filter(p =>
        p.nombre.toLowerCase().includes(busqueda) || p.email.toLowerCase().includes(busqueda)
      );

      const tbody = document.getElementById('tablaPedidos');
      const empty = document.getElementById('sinPedidos');

      if (lista.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      tbody.innerHTML = lista.map(p => {
        const fecha = new Date(p.fecha).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' });
        const prods = p.productos.map(i => `${i.brand} ${i.model} T.${i.size}`).join(', ');
        const colorCls = ESTADO_COLORS[p.estado] || 'text-gray-400 border-gray-400/40 bg-gray-400/10';
        return `
      <tr class="border-b border-border hover:bg-card/60 transition-colors">
        <td class="px-4 py-3 font-mono text-xs text-orange font-bold">#${p.id}</td>
        <td class="px-4 py-3 font-mono text-xs text-gray-500">${fecha}</td>
        <td class="px-4 py-3">
          <p class="font-mono text-sm text-white">${p.nombre}</p>
          <p class="font-mono text-[10px] text-gray-600">${p.email}</p>
        </td>
        <td class="px-4 py-3 font-mono text-xs text-gray-400 max-w-xs truncate">${prods}</td>
        <td class="px-4 py-3 font-condensed font-black italic text-lg text-orange">$${Number(p.total_ars).toLocaleString('es-AR')} ARS</td>
        <td class="px-4 py-3">
          <span class="font-mono text-[10px] uppercase tracking-widest px-2 py-1 border ${colorCls}">${p.estado}</span>
          ${p.tracking ? `<p class="font-mono text-[9px] text-gray-600 mt-1">📍 ${p.tracking}</p>` : ''}
        </td>
        <td class="px-4 py-3">
          <button onclick="abrirModal(${p.id})" class="btn btn-secondary px-3 py-1 text-xs">Ver / Editar</button>
        </td>
      </tr>`;
      }).join('');
    }

    // ── MODAL ──────────────────────────────────────────────────
    function abrirModal(id) {
      const p = pedidos.find(x => x.id === id);
      if (!p) return;
      const fecha = new Date(p.fecha).toLocaleString('es-AR');

      document.getElementById('modalTitulo').textContent = `Pedido #${p.id}`;
      document.getElementById('modalContenido').innerHTML = `
    <!-- Info cliente -->
    <div class="border border-border p-4 bg-bg">
      <p class="font-mono text-[10px] uppercase tracking-widest text-orange mb-3">Cliente</p>
      <div class="grid grid-cols-2 gap-2 font-mono text-xs">
        <div><span class="text-gray-600">Nombre:</span> <span class="text-white">${p.nombre}</span></div>
        <div><span class="text-gray-600">Email:</span> <span class="text-white">${p.email}</span></div>
        <div><span class="text-gray-600">Tel:</span> <span class="text-white">${p.telefono || '—'}</span></div>
        <div><span class="text-gray-600">Provincia:</span> <span class="text-white">${p.provincia || '—'}</span></div>
        <div class="col-span-2"><span class="text-gray-600">Dirección:</span> <span class="text-white">${p.direccion || '—'}</span></div>
        <div class="col-span-2"><span class="text-gray-600">Fecha:</span> <span class="text-white">${fecha}</span></div>
      </div>
    </div>

    <!-- Productos -->
    <div class="border border-border p-4 bg-bg">
      <p class="font-mono text-[10px] uppercase tracking-widest text-orange mb-3">Productos</p>
      ${p.productos.map(i => `
        <div class="flex justify-between font-mono text-xs py-2 border-b border-border last:border-0">
          <span class="text-gray-300">${i.brand} ${i.model} — ${i.color} — T.${i.size}</span>
          <span class="text-orange font-bold">$${Number(i.price).toLocaleString('es-AR')} ARS</span>
        </div>`).join('')}
      <div class="flex justify-between font-condensed font-black italic text-xl mt-3">
        <span>${p.manual ? 'VENTA' : 'TOTAL'}</span><span class="text-orange">$${Number(p.total_ars).toLocaleString('es-AR')} ARS</span>
      </div>
      ${p.manual ? `
      <div class="flex justify-between font-mono text-xs mt-2 text-gray-400">
        <span>Costo (traerla)</span><span>$${p.costo != null ? Number(p.costo).toLocaleString('es-AR') : '—'} ARS</span>
      </div>
      <div class="flex justify-between font-condensed font-black italic text-xl mt-1">
        <span>GANANCIA</span>
        <span class="${p.costo != null && (p.total_ars - p.costo) < 0 ? 'text-red-400' : 'text-green-400'}">
          ${p.costo != null ? '$' + Number(p.total_ars - p.costo).toLocaleString('es-AR') + ' ARS' : '—'}
        </span>
      </div>` : ''}
    </div>

    <!-- Actualizar estado -->
    <div class="border border-border p-4 bg-bg">
      <p class="font-mono text-[10px] uppercase tracking-widest text-orange mb-3">Actualizar Pedido</p>
      <div class="space-y-3">
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Estado</label>
          <select id="modalEstado" class="w-full px-3 py-2">
            ${ESTADOS.map(e => `<option value="${e}" ${p.estado === e ? 'selected' : ''}>${e}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">N° de Seguimiento</label>
          <input id="modalTracking" type="text" placeholder="Ej: OCA123456, Andreani 9876..." class="w-full px-3 py-2" value="${p.tracking || ''}"/>
        </div>
        ${p.manual ? `
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Costo total (traerla) ARS</label>
          <input id="modalCosto" type="number" min="0" step="any" placeholder="0" class="w-full px-3 py-2" value="${p.costo != null ? p.costo : ''}"/>
        </div>` : ''}
        <div>
          <label class="font-mono text-[10px] uppercase tracking-widest text-gray-600 block mb-1">Notas internas</label>
          <textarea id="modalNotas" rows="2" placeholder="Notas para vos..." class="w-full px-3 py-2">${p.notas || ''}</textarea>
        </div>
        <button onclick="guardarCambios(${p.id})" class="btn btn-primary w-full py-3 text-lg">Guardar Cambios</button>
        <p id="modalMsg" class="font-mono text-xs text-center hidden"></p>
        <button onclick="eliminarPedido(${p.id})" class="btn w-full py-2 text-sm mt-1" style="border-color:#ef4444;color:#ef4444;" onmouseover="this.style.background='#ef4444';this.style.color='#080502'" onmouseout="this.style.background='transparent';this.style.color='#ef4444'">Eliminar pedido</button>
      </div>
    </div>
  `;
      document.getElementById('modalDetalle').classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modalDetalle').classList.add('hidden');
    }

    async function eliminarPedido(id) {
      if (!confirm(`¿Seguro que querés eliminar el pedido #${id}? Esta acción no se puede deshacer.`)) return;
      try {
        const res = await fetch(`${API}/api/pedido/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) {
          cerrarModal();
          await cargarDatos();
        } else {
          alert('Error al eliminar: ' + (data.error || 'Respuesta inesperada del servidor.'));
        }
      } catch (err) {
        alert('No se pudo conectar con el servidor. Verificá que el backend esté activo.');
        console.error(err);
      }
    }

    async function guardarCambios(id) {
      const estado = document.getElementById('modalEstado').value;
      const tracking = document.getElementById('modalTracking').value;
      const notas = document.getElementById('modalNotas').value;
      const costoEl = document.getElementById('modalCosto');
      const costo = costoEl ? costoEl.value : undefined;
      const msg = document.getElementById('modalMsg');

      const res = await fetch(`${API}/api/pedido/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado, tracking, notas, costo }),
      });
      const data = await res.json();

      if (data.ok) {
        msg.textContent = '✅ Cambios guardados';
        msg.className = 'font-mono text-xs text-center text-green-400';
        msg.classList.remove('hidden');
        await cargarDatos();
        setTimeout(() => msg.classList.add('hidden'), 2000);
      } else {
        msg.textContent = '❌ Error al guardar';
        msg.className = 'font-mono text-xs text-center text-red-400';
        msg.classList.remove('hidden');
      }
    }
    // ── PEDIDO MANUAL ──────────────────────────────────────────
    function abrirModalManual() {
      document.getElementById('mEstado').innerHTML = ESTADOS.map(e =>
        `<option value="${e}" ${e === 'Entregado' ? 'selected' : ''}>${e}</option>`).join('');
      document.getElementById('formManual').reset();
      document.getElementById('mGanancia').classList.add('hidden');
      document.getElementById('mMsg').classList.add('hidden');
      document.getElementById('modalManual').classList.remove('hidden');
    }

    function cerrarModalManual() {
      document.getElementById('modalManual').classList.add('hidden');
    }

    function calcGanancia() {
      const costo = parseFloat(document.getElementById('mCosto').value);
      const venta = parseFloat(document.getElementById('mVenta').value);
      const box = document.getElementById('mGanancia');
      if (!isNaN(costo) && !isNaN(venta)) {
        const g = venta - costo;
        const val = document.getElementById('mGananciaVal');
        val.textContent = `$${Number(g).toLocaleString('es-AR')} ARS`;
        val.className = g >= 0 ? 'text-green-400' : 'text-red-400';
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
      }
    }

    document.getElementById('formManual').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('mMsg');
      const body = {
        producto: document.getElementById('mProducto').value.trim(),
        nombre:   document.getElementById('mNombre').value.trim(),
        costo:    document.getElementById('mCosto').value,
        venta:    document.getElementById('mVenta').value,
        estado:   document.getElementById('mEstado').value,
        notas:    document.getElementById('mNotas').value.trim(),
      };
      try {
        const res = await fetch(`${API}/api/pedido/manual`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.ok) {
          cerrarModalManual();
          await cargarDatos();
        } else {
          msg.textContent = '❌ ' + (data.error || 'Error al guardar');
          msg.className = 'font-mono text-xs text-center text-red-400';
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.textContent = '❌ No se pudo conectar con el servidor';
        msg.className = 'font-mono text-xs text-center text-red-400';
        msg.classList.remove('hidden');
      }
    });
  </script>
</body>

</html>
